services:
  db:
    image: postgres:15
    container_name: human-draft-postgres
    hostname: human-draft-postgres
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 5
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dev

  redis:
    image: redis:7
    container_name: human-draft-redis
    hostname: human-draft-redis
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "${REDIS_PORT}:6379"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - redis_data:/data
    networks:
      - dev

volumes:
  pg_data:
  redis_data:

networks:
  dev:
